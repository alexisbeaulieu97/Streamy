version: "2"

run:
  timeout: 5m
  tests: true
  allow-parallel-runners: true

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - importas
    - forbidigo
    - contextcheck
    - gomodguard # module-level policy
  disable:
    - depguard # ❗ broken in v2.5.0 for $all/Main (keep config below ready to re-enable)

linters-settings:
  importas:
    alias:
      - alias: domainpipeline
        pkg: github.com/alexisbeaulieu97/streamy/internal/domain/pipeline
      - alias: applicationpipeline
        pkg: github.com/alexisbeaulieu97/streamy/internal/application/pipeline
      - alias: infrastructure
        pkg: github.com/alexisbeaulieu97/streamy/internal/infrastructure
  forbidigo:
    forbid:
      - fmt\.Print.*
      - log\.Print.*
  contextcheck:
    allow-types:
      - "*cobra.Command"
      - "*testing.T"
  gomodguard:
    blocked:
      modules:
        - github.com/sirupsen/logrus:
            recommendations:
              - github.com/charmbracelet/log
            reason: "Use charmbracelet/log for consistent logging"

issues:
  exclude-dirs:
    - specs
